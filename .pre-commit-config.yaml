# Install once with:  uv run pre-commit install --install-hooks
# Run on everything:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

exclude: |
  (?x)^(
    dist/|
    .*\.egg-info/|
    google_analytics_reactjs_demo/reflex\.lock/|
    .*\.pyi$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keep uv.lock in sync with pyproject.toml (same uv version as the workflows).
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
      - id: uv-lock

  # The test suite is fast (~2 s) but needs the project environment, so it runs before push.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
