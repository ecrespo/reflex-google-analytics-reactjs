# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored in the repo.
#
# One-time setup:
#   1. PyPI > Your account > Publishing > "Add a new pending publisher":
#      owner ecrespo, repository reflex-google-analytics-reactjs, workflow publish.yml, environment pypi.
#      Do the same on test.pypi.org with environment testpypi.
#   2. GitHub > Settings > Environments: create "pypi" (optionally with required reviewers) and "testpypi".
#
# Release: bump `version` in pyproject.toml, update CHANGELOG.md, push, then create a GitHub
# release with tag vX.Y.Z. Run the workflow manually to publish to TestPyPI instead.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-google-analytics-reactjs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/reflex-google-analytics-reactjs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
