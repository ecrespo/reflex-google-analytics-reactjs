[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-google-analytics-reactjs"
version = "0.1.0"
description = "Google Analytics 4 for Reflex, powered by react-ga4: config file, automatic SPA page views, consent mode v2, typed GA4 events and ecommerce helpers from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "google-analytics",
    "ga4",
    "gtag",
    "react-ga4",
    "analytics",
    "consent-mode",
]
dependencies = [
    "reflex>=0.9.11",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-google-analytics-reactjs"
Source = "https://github.com/ecrespo/reflex-google-analytics-reactjs"
Issues = "https://github.com/ecrespo/reflex-google-analytics-reactjs/issues"

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_google_analytics_reactjs = ["*.jsx", "*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".web", ".venv", ".devtools", "reflex.lock", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Reflex State class attrs are intentionally mutable defaults
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.6",
]
